name: Public portfolio code example tests

on:
  push:
    branches: [main]
    paths:
      - "public-code-examples/monthly-crime-trends/**"
      - ".github/workflows/public-code-example-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "public-code-examples/monthly-crime-trends/**"
      - ".github/workflows/public-code-example-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: public-code-examples/monthly-crime-trends/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r public-code-examples/monthly-crime-trends/requirements.txt
      - name: Run tests
        working-directory: public-code-examples/monthly-crime-trends
        run: python -m pytest -q
